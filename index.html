<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c11" />
    <meta
      name="description"
      content="BotCompute — lease verified GPU compute on BOT Chain, run workloads on real provider hardware, and tokenise the revenue as CIF."
    />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-64.png" sizes="64x64" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/botcompute.png" />
    <title>BotCompute — Decentralized GPU Compute Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Splash screen shown until React hydrates #root. Pure inline HTML/CSS so
           it appears instantly before the JS bundle loads. React replaces #root's
           children on mount, so this needs no explicit teardown. Colours mirror
           the app tokens so there's no flash of a different palette. -->
      <div
        id="botcompute-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
          background: #0a0c11;
          color: #e6e9f0;
          font-family: Inter, system-ui, sans-serif;
        "
      >
        <img
          src="/botcompute.png"
          alt=""
          style="
            height: 64px;
            width: 64px;
            border-radius: 16px;
            animation: bc-pulse 1.6s ease-in-out infinite;
          "
        />
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <strong style="font-size: 18px; letter-spacing: -0.01em; color: #e6e9f0"
            >BotCompute</strong
          >
          <span style="font-size: 13px; color: #9aa4b8">Decentralized GPU compute marketplace</span>
        </div>
        <div style="display: flex; gap: 6px" role="status" aria-label="Loading">
          <span
            style="
              width: 5px;
              height: 5px;
              border-radius: 50%;
              background: #98cbff;
              animation: bc-dot 1.4s ease-in-out infinite;
            "
          ></span>
          <span
            style="
              width: 5px;
              height: 5px;
              border-radius: 50%;
              background: #98cbff;
              animation: bc-dot 1.4s ease-in-out 0.2s infinite;
            "
          ></span>
          <span
            style="
              width: 5px;
              height: 5px;
              border-radius: 50%;
              background: #98cbff;
              animation: bc-dot 1.4s ease-in-out 0.4s infinite;
            "
          ></span>
        </div>
      </div>
      <style>
        @keyframes bc-pulse {
          0%,
          100% {
            opacity: 1;
            transform: scale(1);
          }
          50% {
            opacity: 0.6;
            transform: scale(0.94);
          }
        }
        @keyframes bc-dot {
          0%,
          80%,
          100% {
            opacity: 0.25;
            transform: translateY(0);
          }
          40% {
            opacity: 1;
            transform: translateY(-3px);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #botcompute-splash img,
          #botcompute-splash span {
            animation: none !important;
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
