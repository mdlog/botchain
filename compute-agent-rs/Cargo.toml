[package]
name = "computerwa-agent"
version = "0.1.0"
edition = "2024"
description = "ComputeRWA Provider Agent — Rust implementation with sandboxed execution"

[dependencies]
# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# EVM (alloy)
alloy = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
hex = "0.4"
anyhow = "1"
thiserror = "2"

# Process management
nix = { version = "0.30", features = ["process", "signal", "sched", "mount", "fs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
